<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dao Dang Tung (Bin) | Portfolio</title>
  <!-- Thêm Google Font Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
<style>
:root {  
  --bg1: #f8fafc;
  --bg2: #f1f5f9;
  --card: #ffffff;  
  --text: #1e293b;
  --sub: #64748b;  
  --accent1: #2563eb;
  --accent2: #eff6ff;
  --border: #e2e8f0;
}

body.dark {  
  --bg1: #0f172a;
  --bg2: #1e293b;
  --card: #1e293b;  
  --text: #f8fafc;
  --sub: #94a3b8;
  --accent1: #3b82f6;
  --accent2: #1e293b;
  --border: #334155;
}

* { box-sizing: border-box; }

body {  
  margin: 0;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;  
  background: linear-gradient(135deg, var(--bg1), var(--bg2));  
  color: var(--text);
  transition: background-color 0.4s ease, color 0.4s ease;
  line-height: 1.6;
}

.container {
  max-width: 900px; /* Thu gọn lại một chút để form chữ đẹp hơn trên Desktop */
  margin: auto;
  padding: 60px 20px;
}

/* HEADER */
header {
  display: flex;
  align-items: center;
  gap: 30px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.avatar-wrap {  
  width: 140px;
  height: 140px;
  border-radius: 50%;
  padding: 5px;  
  background: var(--card);
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  transition: transform 0.3s ease;
}

.avatar-wrap:hover {
  transform: translateY(-5px) scale(1.02);
}

.avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--border);
}

.profile-info {
  flex: 1;
}

h1 {
  margin: 0 0 5px 0;
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.role {
  color: var(--sub);
  font-weight: 500;
  font-size: 16px;
}

.slogan {
  color: var(--accent1);
  margin-top: 8px;
  font-weight: 400;
  opacity: 0.9;
}

/* NGÔN NGỮ */
.lang {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.lang button {  
  border: 1px solid var(--border);
  background: var(--card);  
  color: var(--text);
  padding: 8px 12px;
  border-radius: 8px;  
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s ease;
  box-shadow: 0 2px 5px rgba(0,0,0,0.02);
}

.lang button:hover {
  background: var(--accent1);
  color: #fff;
  border-color: var(--accent1);
  transform: translateY(-2px);
}

/* ICON */
.section-icon {  
  display: inline-flex;
  align-items: center;
  justify-content: center;  
  margin-right: 12px;
  font-size: 24px;
}

/* BANNER */
.banner {  
  margin-top: 40px;
  height: 250px;
  border-radius: 20px;  
  background: url("cover.png") center/cover no-repeat;  
  background-color: var(--border); /* Màu fallback nếu không có ảnh */
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.banner::after {  
  content: "";
  position: absolute;
  inset: 0;  
  background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
}

.banner-caption {  
  position: absolute;
  left: 30px;
  bottom: 20px;
  color: #fff;
  font-size: 16px;
  font-weight: 500;
  z-index: 1;
  letter-spacing: 1px;
}

/* SECTIONS & CARDS */
section {
  margin-top: 40px;
}

.card {  
  background: var(--card);
  border-radius: 20px;
  padding: 40px;  
  box-shadow: 0 4px 20px rgba(0,0,0,0.03);  
  border: 1px solid var(--border);
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.6s ease-out, transform 0.6s ease-out;
}

.card.show {
  opacity: 1;
  transform: none;
}

.card h2 {
  margin-top: 0;
  font-size: 22px;
  display: flex;
  align-items: center;
  border-bottom: 2px solid var(--accent2);
  padding-bottom: 15px;
  margin-bottom: 25px;
}

/* TAGS CONTAINER */
.tags-container {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.tag {  
  display: inline-flex;
  padding: 10px 18px;
  border-radius: 12px;  
  background: var(--accent2);
  color: var(--accent1);
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s ease;
  border: 1px solid transparent;
}

body.dark .tag {
  background: rgba(59, 130, 246, 0.1);
}

.tag:hover {
  background: var(--accent1);
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(37, 99, 235, 0.2);
}

/* QUOTE */
.quote {
  text-align: center;
  font-style: italic;
  color: var(--sub);
  font-size: 20px;
  font-weight: 300;
  padding: 50px 30px;
  background: transparent;
  border: none;
  box-shadow: none;
}

/* CONTACT */
.contact-list p {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
  font-size: 16px;
}

.contact-list a {
  color: var(--text);
  text-decoration: none;
  transition: color 0.2s;
  font-weight: 500;
}

.contact-list a:hover {
  color: var(--accent1);
}

/* FLOATING BUTTONS */
.floating-controls {
  position: fixed;
  right: 25px;
  bottom: 30px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  z-index: 999;
}

.float-btn {  
  width: 50px;
  height: 50px;
  border-radius: 50%;  
  display: flex;
  align-items: center;
  justify-content: center;  
  font-size: 20px;
  cursor: pointer;
  color: #fff;
  border: none;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  transition: transform 0.2s, background 0.2s;
}

.music-btn { background: var(--accent1); }
.dark-btn { background: #334155; }

.float-btn:hover {
  transform: scale(1.1);
}

/* RESPONSIVE */
@media (max-width: 600px) {
  .card { padding: 25px; }
  header { justify-content: center; text-align: center; }
  .lang { justify-content: center; width: 100%; margin-top: 10px; }
  .avatar-wrap { width: 120px; height: 120px; }
}
</style>
</head>
<body>

<div class="container">
  <header>  
    <div class="avatar-wrap"><img src="avatar.jpg" class="avatar" alt="Avatar"></div>  
    <div class="profile-info">    
      <h1 id="name"></h1>    
      <div class="role" id="role"></div>    
      <div class="slogan" id="slogan"></div>  
    </div>  
    <div class="lang">    
      <button onclick="setLang('vi')">🇻🇳 VI</button>    
      <button onclick="setLang('en')">🇬🇧 EN</button>    
      <!-- Bạn có thể mở lại các ngôn ngữ khác nếu muốn -->
      <!-- <button onclick="setLang('cn')">🇨🇳</button> -->
    </div>
  </header>

  <div class="banner"><div class="banner-caption" id="bannerCaption"></div></div>

  <section class="card">  
    <h2><span class="section-icon">👤</span><span id="aboutTitle"></span></h2>  
    <p id="about"></p>
  </section>

  <section class="card">  
    <h2><span class="section-icon">🛠️</span><span id="skillTitle"></span></h2>  
    <div class="tags-container" id="skills"></div>
  </section>

  <section class="card">  
    <h2><span class="section-icon">📂</span><span id="projectTitle"></span></h2>  
    <div class="tags-container" id="projects"></div>
  </section>

  <section class="card">  
    <h2><span class="section-icon">🎯</span><span id="hobbyTitle"></span></h2>  
    <div class="tags-container" id="hobbies"></div>
  </section>

  <section class="card">  
    <h2><span class="section-icon">🚀</span><span id="futureTitle"></span></h2>  
    <p id="future"></p>
  </section>

  <section class="card quote" id="quote"></section>

  <section class="card">  
    <h2><span class="section-icon">📞</span><span id="contactTitle"></span></h2>  
    <div class="contact-list">
      <p>📧 <a href="mailto:dvj1232005@gmail.com">dvj1232005@gmail.com</a></p>  
      <p>📘 <a href="https://facebook.com/tungnehhh" target="_blank">facebook.com/tungnehhh</a></p>  
      <p>📱 <a href="tel:0866823055">0866 823 055</a></p>
    </div>
  </section>
</div>

<audio id="bgMusic" loop><source src="music.mp3"></audio>

<div class="floating-controls">
  <button class="float-btn dark-btn" onclick="toggleDark()" title="Đổi giao diện">🌙</button>
  <button class="float-btn music-btn" onclick="toggleMusic()" title="Bật/Tắt nhạc">🎵</button>
</div>

<script>
const aboutText = { 
  vi: "Xin chào, mình là Tùng 👋 Sinh ngày 23/05/2005, năm nay 20 tuổi. Mình đề cao trách nhiệm, sự rõ ràng trong công việc và luôn giữ tinh thần tích cực. Mình tin rằng phát triển bản thân là một quá trình liên tục.", 
  en: "Hi, I’m Tung 👋 Born on May 23, 2005. I believe personal growth is a continuous journey.", 
  cn: "你好，我是 Tùng 👋 我出生于 2005 年 5 月 23 日，相信成长是一个持续的过程。"
};

const projectsFull = { 
  vi: ["Website portfolio cá nhân", "Website đa ngôn ngữ có nhạc nền", "Quản lý công việc cá nhân", "Website chia sẻ tài liệu", "Website quán cà phê", "Quản lý nhân sự cơ bản", "Website bán hàng mini", "Website nội dung sáng tạo", "Ứng dụng học tập AI mô phỏng", "Website du lịch check in"], 
  en: ["Personal portfolio website", "Multilingual website with music", "Task management system", "Learning resource website", "Coffee shop website", "Basic HR system", "Mini ecommerce website", "Creative content website", "AI learning app simulation", "Travel check in website"]
};

const data = { 
  vi: {  
    role: "Nhân viên tại An Cafe ☕",  
    slogan: "Bắt đầu từ điều nhỏ nhất, kiên trì mỗi ngày.",  
    banner: "Life • Work • Growth",  
    aboutTitle: "Giới thiệu",  
    skillTitle: "Kỹ năng nổi bật",  
    skills: ["Giao tiếp", "Làm việc nhóm", "Quản lý thời gian", "Tinh thần học hỏi", "Sáng tạo"],  
    projectTitle: "Dự án cá nhân",  
    hobbyTitle: "Sở thích",  
    hobbies: ["Chạy bộ 🏃", "Cầu lông 🏸", "Nghe nhạc 🎧", "Đọc sách 📚"],  
    futureTitle: "Mục tiêu tương lai",  
    future: "Không ngừng học hỏi, nâng cao kỹ năng và xây dựng sự nghiệp bền vững.",  
    quote: "“Không cần giỏi ngay từ đầu, chỉ cần không bỏ cuộc.”",  
    contactTitle: "Liên hệ với mình" 
  }, 
  en: {  
    role: "Staff at An Cafe ☕",  
    slogan: "Start small. Stay consistent. Become better every day.",  
    banner: "Life • Work • Growth",  
    aboutTitle: "About Me",  
    skillTitle: "Core Skills",  
    skills: ["Communication", "Teamwork", "Time management", "Self learning", "Creativity"],  
    projectTitle: "My Projects",  
    hobbyTitle: "Hobbies",  
    hobbies: ["Jogging 🏃", "Badminton 🏸", "Music 🎧", "Reading 📚"],  
    futureTitle: "Future Goals",  
    future: "Continuously learning and building a sustainable career.",  
    quote: "“Just don’t quit.”",  
    contactTitle: "Get in touch" 
  }
};

function setLang(l) { 
  document.getElementById("name").innerText = "Đào Đăng Tùng (Bin)"; 
  const d = data[l] || data.en;
  
  document.getElementById("role").innerText = d.role; 
  document.getElementById("slogan").innerText = d.slogan; 
  document.getElementById("bannerCaption").innerText = d.banner;
  
  document.getElementById("aboutTitle").innerText = d.aboutTitle; 
  document.getElementById("about").innerText = aboutText[l] || aboutText.en;
  
  document.getElementById("skillTitle").innerText = d.skillTitle; 
  document.getElementById("skills").innerHTML = d.skills.map(s => `<span class="tag">${s}</span>`).join("");
  
  document.getElementById("projectTitle").innerText = d.projectTitle; 
  document.getElementById("projects").innerHTML = (projectsFull[l] || projectsFull.en).map(p => `<span class="tag">${p}</span>`).join("");
  
  document.getElementById("hobbyTitle").innerText = d.hobbyTitle; 
  document.getElementById("hobbies").innerHTML = d.hobbies.map(h => `<span class="tag">${h}</span>`).join("");
  
  document.getElementById("futureTitle").innerText = d.futureTitle; 
  document.getElementById("future").innerText = d.future;
  
  document.getElementById("quote").innerText = d.quote; 
  document.getElementById("contactTitle").innerText = d.contactTitle;
}

setLang("vi");

// Xử lý nhạc nền
let play = false;
const music = document.getElementById("bgMusic");
function toggleMusic() {
  const btn = document.querySelector('.music-btn');
  if(play) {
    music.pause();
    btn.innerHTML = "🎵";
    btn.style.opacity = "0.7";
  } else {
    music.play();
    btn.innerHTML = "🎶";
    btn.style.opacity = "1";
  }
  play = !play;
}

// Xử lý Dark mode
function toggleDark() {
  document.body.classList.toggle("dark");
  const btn = document.querySelector('.dark-btn');
  if(document.body.classList.contains("dark")) {
    btn.innerHTML = "☀️";
  } else {
    btn.innerHTML = "🌙";
  }
}

// Hiệu ứng cuộn trang
const cards = document.querySelectorAll(".card");
const io = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if(entry.isIntersecting) {
      entry.target.classList.add("show");
    }
  });
}, { threshold: 0.1 });

cards.forEach(c => io.observe(c));
</script>
</body>
</html>
